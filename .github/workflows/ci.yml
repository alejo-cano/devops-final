name: CI/CD Pipeline - Microservicio Menu

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Compilación e instalación de dependencias
        run: |
          cd ms.menu
          npm ci

      - name: Autenticación en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: ./ms.menu
          file: ./ms.menu/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-menu:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-menu:${{ github.sha }}